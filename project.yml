name: PrototypeView
options:
  bundleIdPrefix: com.muse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.2"
targets:
  PrototypeView:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muse.prototypeview
        INFOPLIST_KEY_CFBundleDisplayName: 原型预览
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
